<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sphere Design Hub</title>
    <!-- Theme before first paint (same rule as ThemeContext: saved choice, else
         the system setting), so a dark-mode user never sees a white flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add(d ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <!-- Startup screen while the app's JavaScript downloads (was a blank white
         page). Same look as the app's own "Loading..." screen (ProtectedRoute).
         Pure CSS: hidden as soon as React puts anything in #root, and never
         shown on prerendered public pages (their #root is already filled). -->
    <style>
      html { background: #f3f4f6; }
      html.dark { background: #111827; }
      #boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #f3f4f6; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      html.dark #boot-splash { background: #111827; }
      #root:not(:empty) + #boot-splash { display: none; }
      #boot-splash .b { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 8px; background: #0A2F44;
        display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 700;
        animation: boot-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
      #boot-splash p { margin: 0; text-align: center; color: #6b7280; font-size: 16px; }
      html.dark #boot-splash p { color: #9ca3af; }
      @keyframes boot-pulse { 50% { opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .b { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-live="polite"><div><div class="b">SDH</div><p>Loading...</p></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
